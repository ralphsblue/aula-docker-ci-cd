# Site do nginx da VPS para a aula.
# Recebe as requisições do domínio e repassa para o container na porta 8180.
#
# Instalação (na VPS, veja docs/vps-setup.md):
#   1) troque SEU_SUBDOMINIO pelo subdomínio do DuckDNS;
#   2) copie para /etc/nginx/sites-available/aula-docker;
#   3) ative com um link em /etc/nginx/sites-enabled/;
#   4) "nginx -t && systemctl reload nginx";
#   5) "certbot --nginx --redirect -d SEU_SUBDOMINIO.duckdns.org" adiciona o HTTPS
#      (o certbot edita este arquivo e acrescenta as linhas "managed by Certbot").

server {
    listen 80;
    listen [::]:80;
    server_name SEU_SUBDOMINIO.duckdns.org;

    location / {
        # O container só escuta em 127.0.0.1:8180 (veja docker-compose.prod.yml).
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
