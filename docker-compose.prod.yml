# Compose para a PRODUÇÃO (a VPS).
# Diferenças em relação ao docker-compose.yml local:
#   - a imagem NÃO é buildada aqui: ela vem pronta do registry (GHCR);
#   - a porta só é aberta para a própria VPS (127.0.0.1). Quem recebe o
#     público é o nginx da VPS, que cuida do HTTPS e repassa para cá.
#
#   internet → nginx da VPS (443, HTTPS) → 127.0.0.1:8180 → este container
#
# Na VPS este arquivo se chama docker-compose.yml (o CD copia com esse nome).
# Uso:  docker compose pull
#       docker compose up -d

# Nome fixo do projeto: evita colidir com outros projetos Compose da VPS.
name: aula-docker

services:
  site:
    # Imagem publicada pelo CD no GHCR (fork? troque pelo seu usuário).
    image: ghcr.io/ralphsblue/aula-docker-ci-cd:latest
    # Se o container cair (ou a VPS reiniciar), o Docker sobe de novo.
    restart: unless-stopped
    ports:
      # Só a própria VPS acessa a porta 8180; de fora, só pelo nginx.
      - "127.0.0.1:8180:80"
